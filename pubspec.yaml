name: expenses_tracker
description: A personal finance manager Flutter app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # flutter_local_notifications: ^17.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1
  connectivity_plus:
  sqflite:
  shared_preferences:
  intl: ^0.19.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.0
  cupertino_icons: ^1.0.8
  # permission_handler: ^10.4.2
  pull_to_refresh: ^2.0.0
  printing: ^5.10.2
  pdf: ^3.10.2
  path: ^1.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
